name: Deploy Plaza preview against live Papus data

# Despliegue manual: publica solo el Worker de la Plaza, usando el D1 canónico
# que ya comparte el bot principal. No crea ni migra bases de datos.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papus-plaza-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: plaza-preview
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/plaza-beta

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck bot and shared services
        run: npm run typecheck
      - name: Typecheck Worker, trivia and plaza
        run: npm run worker:typecheck
      - name: Test plaza backend integration
        run: npm test -- tests/pesca/reglas.test.ts tests/mundo-acciones.test.ts tests/mundo-puente.test.ts tests/mundo-estado.test.ts tests/mundo.test.ts

      - name: Build plaza and trivia assets
        run: |
          npm run actividad
          npm run mundo

      - name: Bind isolated Plaza Worker to canonical Papus D1
        env:
          PREVIEW_GUILD_ID: ${{ secrets.PREVIEW_GUILD_ID }}
          PREVIEW_TETO_CLIENT_ID: ${{ secrets.PREVIEW_TETO_CLIENT_ID }}
        run: |
          test -n "$PREVIEW_GUILD_ID"
          test -n "$PREVIEW_TETO_CLIENT_ID"
          python3 - <<'PY'
          import re, os
          from pathlib import Path
          prod = Path("worker/wrangler.toml").read_text()
          match = re.search(r'database_id = "([^"]+)"', prod)
          if not match:
              raise SystemExit("No se encontró el D1 canónico en worker/wrangler.toml")
          database_id = match.group(1)
          if database_id in ("POR_CREAR", "REEMPLAZAR_CON_EL_ID_DE_LA_BASE_PAPUS"):
              raise SystemExit("El D1 canónico no está configurado")
          p = Path("worker/wrangler.preview.toml")
          s = p.read_text()
          replacements = {
              "REEMPLAZAR_CON_EL_ID_DE_LA_BASE_PAPUS": database_id,
              "REEMPLAZAR_CON_ID_DEL_SERVIDOR": os.environ["PREVIEW_GUILD_ID"],
              "REEMPLAZAR_CON_CLIENT_ID_DE_TETO": os.environ["PREVIEW_TETO_CLIENT_ID"],
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Falta placeholder esperado: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          # Guardrail: el Worker preview y el bot principal deben compartir exactamente el mismo D1.
          configured = re.search(r'database_id = "([^"]+)"', s)
          if not configured or configured.group(1) != database_id:
              raise SystemExit("El Worker Plaza no quedó conectado al D1 canónico")
          PY

      - name: Apply additive public-card schema to canonical D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute papus --remote --config=worker/wrangler.preview.toml --file=worker/migrations/0001_mundo_tarjetas.sql --yes

      - name: Set preview OAuth secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_TETO_CLIENT_SECRET: ${{ secrets.PREVIEW_TETO_CLIENT_SECRET }}
        run: |
          test -n "$PREVIEW_TETO_CLIENT_SECRET"
          printf '%s' "$PREVIEW_TETO_CLIENT_SECRET" | npx wrangler secret put TETO_CLIENT_SECRET --config=worker/wrangler.preview.toml

      - name: Verify canonical data binding and isolated Worker target
        run: |
          grep -q '^name = "papus-plaza-preview"' worker/wrangler.preview.toml
          grep -q '^main = "src/preview.ts"' worker/wrangler.preview.toml
          ! grep -q '^name = "papus-bots"' worker/wrangler.preview.toml
          grep -q 'wrangler deploy --config=worker/wrangler.preview.toml' .github/workflows/plaza-preview.yml

      - name: Deploy only the Plaza Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=worker/wrangler.preview.toml
