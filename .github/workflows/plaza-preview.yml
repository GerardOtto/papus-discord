name: Deploy isolated Plaza preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'scripts/actividad.ts'
      - 'scripts/mundo.ts'
      - '.github/workflows/plaza-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papus-plaza-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: plaza-preview
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: feature/plaza-beta

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck bot and shared services
        run: npm run typecheck
      - name: Typecheck Worker, trivia and plaza (profiles)
        run: npm run worker:typecheck

      - name: Build plaza and trivia assets
        run: |
          npm run actividad
          npm run mundo

      - name: Configure preview-only Cloudflare bindings
        env:
          PREVIEW_D1_DATABASE_ID: ${{ secrets.PREVIEW_D1_DATABASE_ID }}
          PREVIEW_GUILD_ID: ${{ secrets.PREVIEW_GUILD_ID }}
          PREVIEW_TETO_CLIENT_ID: ${{ secrets.PREVIEW_TETO_CLIENT_ID }}
        run: |
          test -n "$PREVIEW_D1_DATABASE_ID"
          test -n "$PREVIEW_GUILD_ID"
          test -n "$PREVIEW_TETO_CLIENT_ID"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("worker/wrangler.preview.toml")
          s = p.read_text()
          replacements = {
              "REEMPLAZAR_CON_EL_ID_DE_LA_BASE_PREVIEW": os.environ["PREVIEW_D1_DATABASE_ID"],
              "REEMPLAZAR_CON_ID_DEL_SERVIDOR": os.environ["PREVIEW_GUILD_ID"],
              "REEMPLAZAR_CON_CLIENT_ID_DE_TETO": os.environ["PREVIEW_TETO_CLIENT_ID"],
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Falta placeholder esperado: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Apply isolated D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute papus-plaza-preview --remote --file=worker/schema.preview.sql --config=worker/wrangler.preview.toml

      - name: Set preview OAuth secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_TETO_CLIENT_SECRET: ${{ secrets.PREVIEW_TETO_CLIENT_SECRET }}
        run: |
          test -n "$PREVIEW_TETO_CLIENT_SECRET"
          printf '%s' "$PREVIEW_TETO_CLIENT_SECRET" | npx wrangler secret put TETO_CLIENT_SECRET --config=worker/wrangler.preview.toml

      - name: Deploy only papus-plaza-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=worker/wrangler.preview.toml
